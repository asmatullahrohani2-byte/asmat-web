<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asmat Web Studio | Web Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }

        /* NAVBAR */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 7%;
            background: #0f172a;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            gap: 22px;
            list-style: none;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        /* HERO */
        .hero {
            min-height: 90vh;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 50px;
            padding: 70px 7%;

            color: white;

            background:
                linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .hero-text {
            max-width: 620px;
        }

        .hero-text h1 {
            font-size: 55px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-text h1 span {
            color: #38bdf8;
        }

        .hero-text h2 {
            font-size: 25px;
            margin-bottom: 15px;
            color: #bae6fd;
        }

        .hero-text p {
            color: #dbeafe;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;

            padding: 13px 24px;
            margin: 5px;

            border-radius: 8px;

            background: #38bdf8;
            color: #082f49;

            text-decoration: none;
            font-weight: bold;

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: white;
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid #38bdf8;
        }

        .btn-outline:hover {
            color: #082f49;
        }

        .hero-image {
            width: 430px;
            max-width: 100%;
        }

        .hero-image img {
            width: 100%;
            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.4);
        }

        /* GENERAL SECTION */
        section {
            padding: 85px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 38px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #64748b;
        }

        /* ABOUT */
        .about {
            display: flex;
            align-items: center;
            gap: 60px;
        }

        .about-image {
            flex: 1;
        }

        .about-image img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .about-text {
            flex: 1;
        }

        .about-text h3 {
            font-size: 30px;
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        .about-text p {
            color: #475569;
            margin-bottom: 15px;
        }

        /* SKILLS */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .skill {
            background: white;
            padding: 30px 20px;

            text-align: center;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-8px);
        }

        .skill img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .skill h3 {
            margin-bottom: 5px;
            color: #0f172a;
        }

        .skill p {
            color: #64748b;
        }

        /* SERVICES */
        .services {
            background: #eef2ff;
        }

        .service-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .service-card {
            background: white;

            padding: 25px 20px;

            text-align: center;

            border-radius: 16px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-8px);
        }

        .service-card img {
            width: 100%;
            height: 150px;

            object-fit: cover;

            border-radius: 12px;

            margin-bottom: 18px;
        }

        .service-card h3 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .service-card p {
            color: #64748b;
            margin-bottom: 15px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #0284c7;
            margin-bottom: 15px;
        }

        /* PROJECTS */
        .projects {
            background: white;
        }

        .project-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .project-card {
            overflow: hidden;

            background: #f8fafc;

            border-radius: 16px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-8px);
        }

        .project-card img {
            width: 100%;
            height: 210px;

            object-fit: cover;

            display: block;
        }

        .project-content {
            padding: 23px;
        }

        .project-content h3 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        .project-content p {
            color: #64748b;
            margin-bottom: 15px;
        }

        .project-btn {
            display: inline-block;

            padding: 9px 18px;

            background: #1e3a8a;
            color: white;

            border-radius: 7px;

            text-decoration: none;

            transition: 0.3s;
        }

        .project-btn:hover {
            background: #38bdf8;
            color: #082f49;
        }

        /* CONTACT */
        .contact {
            background: #0f172a;
            color: white;
        }

        .contact .section-title h2 {
            color: white;
        }

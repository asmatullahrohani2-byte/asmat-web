<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Asmat Web Studio - modern websites, landing pages and website editing.">
<title>Asmat Web Studio | Web Developer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}
:root{
--dark:#07111f;
--dark2:#102c55;
--blue:#38bdf8;
--green:#22c55e;
--text:#1e293b;
--muted:#64748b;
--light:#f5f8fc
}
body{
font-family:Arial,Helvetica,sans-serif;
background:var(--light);
color:var(--text);
line-height:1.6
}
a{text-decoration:none}
img{display:block;max-width:100%}
.container{width:min(1120px,92%);margin:auto}

nav{
position:sticky;
top:0;
z-index:999;
background:rgba(7,17,31,.97);
box-shadow:0 4px 20px #0003
}

.nav{
min-height:70px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:26px;
font-weight:800;
color:white
}

.logo span{color:var(--blue)}

.links{
display:flex;
gap:22px;
list-style:none
}

.links a{
color:white;
font-weight:600
}

.links a:hover{color:var(--blue)}

.menu{
display:none;
background:none;
border:0;
color:white;
font-size:28px
}

.hero{
min-height:calc(100vh - 70px);
padding:70px 0;
background:linear-gradient(135deg,var(--dark),var(--dark2) 65%,#075985);
color:white
}

.hero-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center
}

.hero h1{
font-size:clamp(42px,6vw,68px);
line-height:1.05;
margin-bottom:18px
}

.hero h1 span{color:var(--blue)}

.hero h2{
color:#bae6fd;
margin-bottom:15px
}

.hero p{
color:#dbeafe;
font-size:18px;
max-width:650px;
margin-bottom:25px
}

.buttons{
display:flex;
gap:8px;
flex-wrap:wrap
}

.btn{
display:inline-block;
padding:12px 21px;
border-radius:9px;
background:var(--blue);
border:2px solid var(--blue);
color:#06243a;
font-weight:800;
transition:.25s
}

.btn:hover{
transform:translateY(-3px);
background:white;
border-color:white
}

.green{
background:var(--green);
border-color:var(--green);
color:white
}

.outline{
background:transparent;
color:white
}

.hero-img{position:relative}

.hero-img img{
height:430px;
width:100%;
object-fit:cover;
border-radius:24px;
box-shadow:0 25px 60px #0006
}

.badge{
position:absolute;
bottom:18px;
left:18px;
background:#07111fe8;
color:white;
padding:12px 16px;
border-radius:12px
}

section{padding:85px 0}

.head{
text-align:center;
margin-bottom:45px
}

.head h2{
font-size:38px;
color:var(--dark);
margin-bottom:8px
}

.head p{color:var(--muted)}

.about{
display:grid;
grid-template-columns:1fr 1fr;
gap:55px;
align-items:center
}

.about img{
height:380px;
width:100%;
object-fit:cover;
border-radius:20px
}

.about h3{
font-size:30px;
color:#173d78;
margin-bottom:14px
}

.about p{
color:#475569;
margin-bottom:14px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:22px
}

.stat{
background:white;
padding:18px;
text-align:center;
border-radius:13px;
box-shadow:0 6px 20px #00000010
}

.stat strong{
display:block;
font-size:26px;
color:#0284c7
}

.stat span{
color:var(--muted);
font-size:13px
}

.skills{background:#eef6ff}

.grid4{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px
}

.skill,
.service,
.project{
background:white;
border-radius:16px;
box-shadow:0 7px 25px #00000012;
overflow:hidden;
transition:.25s
}

.skill{
padding:28px 18px;
text-align:center
}

.skill:hover,
.service:hover,
.project:hover{
transform:translateY(-7px)
}

.icon{
font-size:48px;
margin-bottom:10px
}

.skill p,
.service p,
.project p{
color:var(--muted)
}

.services{background:#f1f5ff}

.service{
text-align:center;
padding-bottom:22px
}

.service img{
width:100%;
height:155px;
object-fit:cover
}

.service-body{padding:20px}

.service h3{
color:#173d78;
margin-bottom:7px
}

.price{
font-size:28px;
font-weight:800;
color:#0284c7;
margin:12px 0
}

.projects{background:white}

.projects-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px
}

.project img{
width:100%;
height:220px;
object-fit:cover
}

.project-body{padding:21px}

.project h3{margin-bottom:8px}

.project-btn{
display:inline-block;
margin-top:12px;
padding:9px 16px;
border-radius:7px;
background:#173d78;
color:white
}

.project-btn:hover{
background:var(--blue);
color:#06243a
}

.contact{
background:var(--dark);
color:white
}

.contact .head h2{color:white}

.contact .head p{color:#cbd5e1}

.box{
max-width:780px;
margin:auto;
background:#12223a;
padding:35px;
border-radius:20px;
text-align:center
}

.item{margin:17px}

.item strong{
display:block;
color:#94a3b8;
margin-bottom:4px
}

.item a{
color:var(--blue);
font-size:18px
}

footer{
background:#020812;
color:#94a3b8;
text-align:center;
padding:28px
}

footer span{color:var(--blue)}

.top{
position:fixed;
right:18px;
bottom:18px;
width:44px;
height:44px;
border-radius:50%;
display:grid;
place-items:center;
background:var(--blue);
color:#06243a;
font-weight:900
}

@media(max-width:900px){

.hero-grid,
.about{
grid-template-columns:1fr
}

.hero{text-align:center}

.hero p{
margin-left:auto;
margin-right:auto
}

.buttons{
justify-content:center
}

.hero-img{
max-width:650px;
margin:auto
}

.grid4{
grid-template-columns:repeat(2,1fr)
}

.projects-grid{
grid-template-columns:1fr 1fr
}

}

@media(max-width:650px){

.menu{display:block}

.links{
display:none;
position:absolute;
top:70px;
left:0;
right:0;
background:var(--dark);
padding:18px 4%;
flex-direction:column;
gap:13px
}

.links.open{display:flex}

.hero{padding:60px 0}

.hero-img img{height:300px}

section{padding:65px 0}

.head h2{font-size:30px}

.grid4,
.projects-grid,
.stats{
grid-template-columns:1fr
}

.box{padding:25px 15px}

}
</style>
</head>

<nav>
<div class="container nav">

<a class="logo" href="#home">
Asmat<span>Web</span>
</a>
